# Manual runs only — does NOT run on push to main.
# Protects https://micropolisweb.com/ during development: merge freely; publish only when ready.
# (touched to force GitHub Actions to re-index this workflow file)
#
# Actions → Build Wasm Library with Emscripten → Run workflow
#
# What this does:
#   1. Build C++/WASM engine (packages/micropolis-engine → make install)
#   2. Commit the rebuilt engine artifacts back to this branch ONLY if you
#      check "Commit rebuilt engine artifacts" (default: off)
#   3. Verify monorepo structure invariants (pnpm run verify:structure)
#   4. Build vitamoo/mooshow (needed by monorepo.integration.test.ts's dist checks)
#   5. Run Vitest suite against real WASM (pnpm --filter micropolis run test)
#   6. Optionally generate Doxygen C++ API docs
#   7. Build SvelteKit app (vite build)
#   8. Deploy to GitHub Pages ONLY if you check "Deploy to GitHub Pages" (default: off)

name: Build Wasm Library with Emscripten

on:
  workflow_dispatch:
    inputs:
      include_doxygen:
        description: Generate Doxygen C++ API HTML and publish it at /doc on Pages
        type: boolean
        default: true
      deploy_to_pages:
        description: >-
          Deploy build to GitHub Pages (micropolisweb.com). Leave unchecked while
          developing — verify the build first, then re-run with this enabled.
        type: boolean
        default: false
      commit_rebuilt_engine:
        description: >-
          Commit + push the freshly-built micropolisengine.{js,wasm,data}/.d.ts
          back to this branch if the build changed them. Leave unchecked for a
          routine verification run.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: micropolis-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten toolchain
        uses: mymindstorm/setup-emsdk@v14

      - name: Install Doxygen
        if: ${{ inputs.include_doxygen }}
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build C++/WASM engine (packages/micropolis-engine → make install)
        run: |
          emcc --version
          pnpm --filter @micropolis/engine-wasm run build

      - name: Commit rebuilt engine artifacts
        # Gated only on the build above, not on later/unrelated steps -- a
        # custom `if:` implicitly ANDs success(), so placing this after Vitest
        # meant any later step failing would silently skip the commit.
        if: ${{ inputs.commit_rebuilt_engine }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            apps/micropolis/src/lib/micropolisengine.js \
            apps/micropolis/src/lib/micropolisengine.wasm \
            apps/micropolis/src/lib/micropolisengine.data \
            apps/micropolis/src/types/micropolisengine.d.ts
          if git diff --cached --quiet; then
            echo "Rebuilt engine artifacts are unchanged; nothing to commit."
          else
            git commit -m "Rebuild WASM engine artifacts (automated, workflow_dispatch)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Verify monorepo structure
        run: pnpm run verify:structure

      - name: Build vitamoo/mooshow (dist files checked by monorepo.integration.test.ts)
        run: pnpm --filter vitamoo --filter mooshow run build

      - name: Run Micropolis Vitest suite
        run: pnpm --filter micropolis run test

      - name: Build optional Doxygen C++ API docs
        if: ${{ inputs.include_doxygen }}
        run: |
          doxygen Doxyfile 2>doxygen_warnings >/dev/null
          echo "Doxygen warnings:"
          cat doxygen_warnings || true

      - name: Build SvelteKit app (Vite → build/)
        # `pnpm --filter micropolis run build` would also re-trigger the
        # prebuild hook (re-running make install, already done above), so call
        # vite directly instead -- same fix already proven for the Cloudflare
        # deploy's build command.
        run: pnpm --filter micropolis exec vite build

      - name: Assemble Pages output
        run: |
          mkdir -p _site/doc
          cp -r apps/micropolis/build/. _site/
          if [ "${{ inputs.include_doxygen }}" = "true" ] && [ -d html ]; then
            cp -r html/. _site/doc/
          fi

      - name: Deploy to GitHub Pages
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          inputs.deploy_to_pages == true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
